name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas (Vitest)
        run: npm test
      - name: Build del demo estático
        run: npm run build:demo
      - name: Build de la imagen Docker
        run: docker build -t banco-evaluaciones .
