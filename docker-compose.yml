# Levanta PostgreSQL 16 y la API (que también sirve la interfaz React).
# Uso: cp .env.example .env  →  docker compose up --build  →  http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco}
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-banco}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banco}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      DEMO_LOGIN: ${DEMO_LOGIN:-true}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
